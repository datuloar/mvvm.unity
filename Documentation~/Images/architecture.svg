<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MVVM Unity architecture</title>
  <desc id="desc">Models feed plain C# ViewModels; generated bindings connect them to Views inside a disposable binding scope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#8ea6ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7357ff"/>
      <stop offset="1" stop-color="#a970ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#63729b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="190" fill="#6c8cff" opacity=".05"/>
  <circle cx="110" cy="620" r="220" fill="#4ade80" opacity=".04"/>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="60" y="64" fill="#f5f7ff" font-size="28" font-weight="700">One direction, three assemblies</text>
    <text x="60" y="94" fill="#9aa7c7" font-size="16">ViewModels never see Unity. Views never compute. Every binding owns its cleanup.</text>

    <g filter="url(#shadow)">
      <rect x="60" y="140" width="230" height="250" rx="18" fill="#171f39" stroke="#6b5424"/>
      <rect x="60" y="140" width="7" height="250" rx="4" fill="url(#amber)"/>
      <text x="86" y="176" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="1.5">MODEL</text>
      <text x="86" y="210" fill="#fff" font-size="23" font-weight="700">HeroDraft</text>
      <text x="86" y="238" fill="#9aa7c7" font-size="14">Rules and authoritative</text>
      <text x="86" y="258" fill="#9aa7c7" font-size="14">state in plain C#</text>
      <rect x="86" y="290" width="178" height="30" rx="15" fill="#2b2414"/>
      <text x="175" y="310" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">event Changed</text>
      <rect x="86" y="330" width="178" height="30" rx="15" fill="#2b2414"/>
      <text x="175" y="350" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">Increase(stat)</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="340" y="140" width="250" height="250" rx="18" fill="#171f39" stroke="#2f4f8f"/>
      <rect x="340" y="140" width="7" height="250" rx="4" fill="url(#blue)"/>
      <text x="366" y="176" fill="#8ea6ff" font-size="13" font-weight="700" letter-spacing="1.5">VIEWMODEL</text>
      <text x="366" y="210" fill="#fff" font-size="23" font-weight="700">Plain C#</text>
      <text x="366" y="238" fill="#9aa7c7" font-size="14">mvvm.unity.core</text>
      <text x="366" y="258" fill="#9aa7c7" font-size="14">no engine references</text>
      <rect x="366" y="290" width="198" height="30" rx="15" fill="#172a4f"/>
      <text x="465" y="310" text-anchor="middle" fill="#a9bcff" font-size="12" font-weight="700">ObservableValue&lt;T&gt;</text>
      <rect x="366" y="330" width="198" height="30" rx="15" fill="#172a4f"/>
      <text x="465" y="350" text-anchor="middle" fill="#a9bcff" font-size="12" font-weight="700">ICommand · ICommand&lt;T&gt;</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="640" y="140" width="250" height="250" rx="18" fill="#171f39" stroke="#40366f"/>
      <rect x="640" y="140" width="7" height="250" rx="4" fill="url(#violet)"/>
      <text x="666" y="176" fill="#b9a4ff" font-size="13" font-weight="700" letter-spacing="1.5">GENERATED</text>
      <text x="666" y="210" fill="#fff" font-size="23" font-weight="700">BindGenerated</text>
      <text x="666" y="238" fill="#9aa7c7" font-size="14">mvvm.unity.editor writes</text>
      <text x="666" y="258" fill="#9aa7c7" font-size="14">ordinary committed C#</text>
      <rect x="666" y="290" width="198" height="30" rx="15" fill="#2a2446"/>
      <text x="765" y="310" text-anchor="middle" fill="#c4b5ff" font-size="12" font-weight="700">direct typed calls</text>
      <rect x="666" y="330" width="198" height="30" rx="15" fill="#2a2446"/>
      <text x="765" y="350" text-anchor="middle" fill="#c4b5ff" font-size="12" font-weight="700">validated in Editor</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="940" y="140" width="200" height="250" rx="18" fill="#171f39" stroke="#276b4e"/>
      <rect x="940" y="140" width="7" height="250" rx="4" fill="url(#green)"/>
      <text x="966" y="176" fill="#7ee2a8" font-size="13" font-weight="700" letter-spacing="1.5">VIEW</text>
      <text x="966" y="210" fill="#fff" font-size="23" font-weight="700">MvvmView</text>
      <text x="966" y="238" fill="#9aa7c7" font-size="14">mvvm.unity</text>
      <text x="966" y="258" fill="#9aa7c7" font-size="14">widgets only</text>
      <rect x="966" y="290" width="148" height="30" rx="15" fill="#15352c"/>
      <text x="1040" y="310" text-anchor="middle" fill="#7ee2a8" font-size="12" font-weight="700">uGUI · TMP</text>
      <rect x="966" y="330" width="148" height="30" rx="15" fill="#15352c"/>
      <text x="1040" y="350" text-anchor="middle" fill="#7ee2a8" font-size="12" font-weight="700">Bind() override</text>
    </g>

    <path d="M292 250h44" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M592 250h44" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M892 250h44" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1040 394v34H465v-34" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="752" y="450" text-anchor="middle" fill="#7ee2a8" font-size="13" font-weight="700" letter-spacing="1.2">TWO-WAY INPUT · CLICKS · COMMAND ARGUMENTS</text>

    <rect x="60" y="484" width="1080" height="96" rx="18" fill="#121a31" stroke="#26345a"/>
    <text x="88" y="518" fill="#8ea6ff" font-size="13" font-weight="700" letter-spacing="1.5">LIFETIME</text>
    <g font-size="14" font-weight="700">
      <rect x="88" y="534" width="148" height="30" rx="15" fill="#172a4f"/>
      <text x="162" y="554" text-anchor="middle" fill="#dfe6ff">OnEnable</text>
      <rect x="258" y="534" width="176" height="30" rx="15" fill="#2a2446"/>
      <text x="346" y="554" text-anchor="middle" fill="#dfe6ff">new BindingScope</text>
      <rect x="456" y="534" width="210" height="30" rx="15" fill="#2a2446"/>
      <text x="561" y="554" text-anchor="middle" fill="#dfe6ff">BindGenerated · Bind</text>
      <rect x="688" y="534" width="182" height="30" rx="15" fill="#172a4f"/>
      <text x="779" y="554" text-anchor="middle" fill="#dfe6ff">OnDisable · Destroy</text>
      <rect x="892" y="534" width="220" height="30" rx="15" fill="#15352c"/>
      <text x="1002" y="554" text-anchor="middle" fill="#7ee2a8">every listener removed</text>
    </g>
    <path d="M238 549h16" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M436 549h16" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M668 549h16" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M872 549h16" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
