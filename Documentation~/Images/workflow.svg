<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MVVM Unity workflow</title>
  <desc id="desc">Write a ViewModel, declare widgets, save to generate bindings, then test the ViewModel in EditMode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6c8cff"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="340" r="180" fill="#4ade80" opacity=".04"/>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="60" y="62" fill="#f5f7ff" font-size="28" font-weight="700">From ViewModel to live screen</text>
    <text x="60" y="92" fill="#9aa7c7" font-size="16">No registration, no bootstrap, no runtime lookup.</text>
    <rect x="60" y="112" width="1080" height="3" rx="1.5" fill="url(#accent)" opacity=".5"/>

    <g filter="url(#shadow)">
      <rect x="60" y="146" width="240" height="170" rx="18" fill="#171f39" stroke="#2f4f8f"/>
      <circle cx="96" cy="182" r="18" fill="#6c8cff"/>
      <text x="96" y="188" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="84" y="236" fill="#fff" font-size="20" font-weight="700">Write a ViewModel</text>
      <text x="84" y="264" fill="#9aa7c7" font-size="14">Observables, commands</text>
      <text x="84" y="284" fill="#9aa7c7" font-size="14">and intents in plain C#</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="340" y="146" width="240" height="170" rx="18" fill="#171f39" stroke="#2f4f8f"/>
      <circle cx="376" cy="182" r="18" fill="#6c8cff"/>
      <text x="376" y="188" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="364" y="236" fill="#fff" font-size="20" font-weight="700">Declare widgets</text>
      <text x="364" y="264" fill="#9aa7c7" font-size="14">_title binds to Title,</text>
      <text x="364" y="284" fill="#9aa7c7" font-size="14">_submit binds to Submit</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="620" y="146" width="240" height="170" rx="18" fill="#171f39" stroke="#40366f"/>
      <circle cx="656" cy="182" r="18" fill="#8b6cff"/>
      <text x="656" y="188" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">3</text>
      <text x="644" y="236" fill="#fff" font-size="20" font-weight="700">Save</text>
      <text x="644" y="264" fill="#9aa7c7" font-size="14">Editor validates and writes</text>
      <text x="644" y="284" fill="#9aa7c7" font-size="14">View.Bindings.g.cs</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="900" y="146" width="240" height="170" rx="18" fill="#171f39" stroke="#276b4e"/>
      <circle cx="936" cy="182" r="18" fill="#2fbf71"/>
      <text x="936" y="188" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">4</text>
      <text x="924" y="236" fill="#fff" font-size="20" font-weight="700">Test and ship</text>
      <text x="924" y="264" fill="#9aa7c7" font-size="14">EditMode tests without</text>
      <text x="924" y="284" fill="#9aa7c7" font-size="14">scenes; commit both files</text>
    </g>

    <path d="M302 231h34" stroke="#6c8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M582 231h34" stroke="#6c8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M862 231h34" stroke="#6c8cff" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
