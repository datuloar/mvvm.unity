<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">MVVM Unity</title>
  <desc id="desc">Typed MVVM for Unity UI: a serialized field name becomes a generated, reflection-free binding.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset=".55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25345d" stop-opacity=".94"/>
      <stop offset="1" stop-color="#1b2344" stop-opacity=".86"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6c8cff"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="30" fill="url(#background)"/>
  <circle cx="1060" cy="40" r="230" fill="#6c8cff" opacity=".07"/>
  <circle cx="420" cy="540" r="250" fill="#4ade80" opacity=".05"/>
  <circle cx="880" cy="250" r="110" fill="#6c8cff" opacity=".14" filter="url(#glow)"/>

  <g transform="translate(64 54)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="58" height="24" rx="12" fill="#162b4d" stroke="#2c4f8a"/>
    <text x="29" y="16" text-anchor="middle" fill="#8ea6ff" font-size="10" font-weight="700" letter-spacing="1.2">UNITY</text>
    <text x="0" y="104" fill="#fff" font-size="86" font-weight="800" letter-spacing="-3">MVVM</text>
    <rect x="0" y="119" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="160" fill="#a9bcff" font-size="13" font-weight="700" letter-spacing="2.2">TYPED DATA BINDING FOR UGUI</text>
    <text x="0" y="211" fill="#f4f7ff" font-size="29" font-weight="700">Name a field. Get a binding.</text>
    <text x="0" y="247" fill="#f4f7ff" font-size="29" font-weight="700">Nothing hidden at runtime.</text>
    <text x="0" y="286" fill="#a7b3d1" font-size="16">Plain C# ViewModels, generated C# bindings, scoped lifetimes.</text>

    <g transform="translate(0 322)" font-size="11" font-weight="700">
      <rect width="118" height="32" rx="16" fill="#172a4f" stroke="#2f4f8f"/>
      <text x="59" y="20" text-anchor="middle" fill="#a9bcff">GENERATED C#</text>
      <rect x="130" width="136" height="32" rx="16" fill="#15352c" stroke="#276b4e"/>
      <text x="198" y="20" text-anchor="middle" fill="#7ee2a8">0 REFLECTION</text>
      <rect x="278" width="112" height="32" rx="16" fill="#2a2446" stroke="#4d3f86"/>
      <text x="334" y="20" text-anchor="middle" fill="#c4b5ff">74 TESTS</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Consolas,Menlo,monospace">
    <rect x="596" y="58" width="540" height="148" rx="20" fill="url(#glass)" stroke="#3a4c7d"/>
    <circle cx="624" cy="84" r="5" fill="#ff6b6b"/>
    <circle cx="642" cy="84" r="5" fill="#ffd166"/>
    <circle cx="660" cy="84" r="5" fill="#4ade80"/>
    <text x="1112" y="88" text-anchor="end" fill="#7d8bb3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">VIEW</text>
    <text x="624" y="124" fill="#8ea6ff" font-size="15">[GenerateBindings]</text>
    <text x="624" y="150" fill="#dfe6ff" font-size="15"><tspan fill="#c792ea">partial class</tspan> HeroView : MvvmView&lt;HeroViewModel&gt;</text>
    <text x="624" y="180" fill="#dfe6ff" font-size="15"><tspan fill="#7d8bb3">[SerializeField]</tspan> TMP_Text <tspan fill="#4ade80">_name</tspan>;</text>
  </g>

  <path d="M866 214v46" stroke="#6c8cff" stroke-width="2.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="886" y="244" fill="#8ea6ff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">EDITOR GENERATES</text>

  <g filter="url(#shadow)" font-family="Consolas,Menlo,monospace">
    <rect x="596" y="272" width="540" height="96" rx="20" fill="#121a31" stroke="#2c3d66"/>
    <text x="1112" y="300" text-anchor="end" fill="#7d8bb3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">BINDINGS.G.CS</text>
    <text x="624" y="334" fill="#dfe6ff" font-size="15">bindings.<tspan fill="#82aaff">Text</tspan>(<tspan fill="#4ade80">_name</tspan>, viewModel.<tspan fill="#4ade80">Name</tspan>);</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="596" y="386" width="540" height="56" rx="16" fill="#151c31" stroke="#2c3d66"/>
    <circle cx="630" cy="414" r="16" fill="#6c8cff"/>
    <text x="630" y="420" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">A</text>
    <text x="660" y="420" fill="#f4f7ff" font-size="17" font-weight="700">Aria the Mage</text>
    <rect x="990" y="400" width="126" height="28" rx="14" fill="#4ade80" opacity=".16"/>
    <text x="1053" y="419" text-anchor="middle" fill="#7ee2a8" font-size="12" font-weight="700" letter-spacing="1">LIVE BINDING</text>
  </g>
</svg>
